<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <title>Document</title>
</head>
<body>

    <main>
        <section class="sessao-imagem">
            <img src="tela-login.png" alt="Casal numa livraria">
        </section>

        <section class="sessao-login">
             <div class="area-titulo">
                <h1>Connect<samp>Book</samp></h1>
                <h2>Troque livros, multiplique histórias</h2>
             </div>

             <form action="#" method="post" id="form-login">
                <label for="email"> Usuário ou E-mail </label>
                <input type="text" id="email">

                <label for="senha"> Senha </label>
                <input type="password" id="senha" placeholder="Informe sua senha">

                <div class="links-senha" >
                    <input type="checkbox" id="lembrar-senha">
                    <label for="lembrar-senha"> Lembrar senha </label>

                    <a href="#" id="esqueceu-senha"> Esqueceu a senha? </a>

                    <button id="btn-acessar"> Acessar </button> 
                    <a href="#" id="link-nao-conta"> Ainda não possuo uma conta </a>
                    
                </div>
             </form>
        </section>
    </main>
    
</body>
</html>
