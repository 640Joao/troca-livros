<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="cadastro.css">
    <title>Área de Login</title>
</head>
<body>

    <main>

        
        
        <section class="sessao-login">
            <div class="area-titulo">
                <h1>Connect<span>Book</span></h1>
                <h2>Troque livros, multiplique histórias</h2>
            </div>

            <form action="#" method="post" id="form-login">

                <label for="email"> Nome </label>
                <input type="text" id="name" placeholder="Informe seu nome">
                
                <label for="email"> E-mail </label>
                <input type="text" id="email" placeholder="Informe seu E-mail">

                <label for="email"> Usuário </label>
                <input type="text" id="user" placeholder="Informe seu nome">

                <div class="cadastro-senha">
                    <div>
                        <label for="senha"> Senha </label>
                        <input type="password" id="senha" placeholder="Informe sua senha">
                    </div>
                    <div>
                        <label for="senha"> Confirmar Senha </label>
                        <input type="password" id="senha" placeholder="Confirme a Senha">
                    </div>
                </div>

                <div class="links-senha"> 
                    <input type="checkbox" id="lembrar-senha">
                    <label for="lembrar-senha"> Lembrar senha </label>
                    
                    <a href="#" id="link-esqueceu-senha"> Esqueceu a senha? </a>
                </div>

                <button id="btn-acessar"> Cadastrar </button>

            </form>

        </section>

        <section class="sessao-imagem">
            <img src="tela-login.png" alt="Casal numa livraria">
        </section>

    </main>

    
</body>
</html>
